[package]
name = "wasi-nn-slm"
version = "0.1.0"
edition = "2021"
description = "Minimal wasi-nn SLM runner (Gemma 3 270M ONNX) targeting wasm32-wasip2."
publish = false

[[bin]]
name = "wasi-nn-slm"
path = "src/main.rs"

[dependencies]
wit-bindgen = "0.57"
tokenizers = { version = "0.23", default-features = false, features = ["unstable_wasm"] }
# Profiles are defined at the workspace root.
